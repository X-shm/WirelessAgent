<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BLE 功率与距离扫描 · WirelessAgent</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172336;background:#f3f6fa}
    *{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:32px 20px 64px}
    h1{font-size:clamp(1.6rem,3vw,2.4rem);margin:0 0 10px}h2{margin:0 0 18px;font-size:1.2rem}
    p{line-height:1.65}.lede{color:#4d6075;max-width:780px;margin:0 0 28px}
    .grid{display:grid;grid-template-columns:minmax(260px,350px) 1fr;gap:20px;align-items:start}
    .card{background:#fff;border:1px solid #dce4ed;border-radius:16px;box-shadow:0 8px 25px #21304a0b;padding:22px}
    label{display:block;font-size:.9rem;font-weight:650;margin:14px 0 6px}input{width:100%;border:1px solid #adbed0;border-radius:9px;padding:10px 12px;font:inherit;color:inherit;background:#fff}
    input:focus,button:focus{outline:3px solid #98c8ff;outline-offset:2px}small{display:block;color:#5f7186;margin-top:5px}
    button{background:#075d9d;border:0;border-radius:9px;color:white;font:inherit;font-weight:650;padding:11px 18px;cursor:pointer;margin-top:18px}
    button:hover{background:#064b80}button:disabled{opacity:.55;cursor:wait}.status{display:flex;gap:12px;align-items:center;margin-bottom:15px}
    .badge{border-radius:999px;background:#e6f0fa;color:#0a5488;padding:5px 10px;font-size:.82rem;font-weight:700}
    progress{width:100%;height:13px;accent-color:#0879be}.muted{color:#637487}.error{color:#a22020;white-space:pre-wrap}
    .report{margin-top:20px}.chart{width:100%;min-height:260px;border:1px solid #e2e9f0;border-radius:10px;background:#fbfdff}
    table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:right;padding:10px 8px;border-bottom:1px solid #e2e8ef}th:first-child,td:first-child{text-align:left}
    .scroll{overflow-x:auto}ul{line-height:1.7;padding-left:22px}.events{max-height:240px;overflow:auto;font:12px/1.5 ui-monospace,monospace;color:#34495f;background:#f7f9fc;padding:12px;border-radius:10px}
    .events div{padding:4px 0;border-bottom:1px solid #e5eaf0}.note{border-left:4px solid #0879be;padding:8px 13px;background:#eef7fd}
    @media(max-width:760px){.grid{grid-template-columns:1fr}main{padding-top:20px}}
  </style>
</head>
<body>
<main>
  <h1>BLE 发射功率与距离扫描</h1>
  <p class="lede">设置发射功率、接收灵敏度和测试距离。Agent 调用 Wireless Toolbox 计算路径损耗，逐点运行收包仿真，并核验功率与事件记录。</p>
  <div class="grid">
    <section class="card" aria-labelledby="setup-title">
      <h2 id="setup-title">仿真参数</h2>
      <form id="task-form">
        <label for="tx-power">发射功率 · dBm</label>
        <input id="tx-power" type="number" min="-20" max="20" step="0.1" value="0" required>
        <label for="sensitivity">接收灵敏度 · dBm</label>
        <input id="sensitivity" type="number" min="-110" max="-70" step="0.1" value="-75" required>
        <label for="distances">测试距离 · 米</label>
        <input id="distances" value="1,5,10,25,50,100" required>
        <small>2～20 个严格递增的距离，范围 1～1000 米，用逗号分隔。</small>
        <label for="packets">每个距离发送的数据包数</label>
        <input id="packets" type="number" min="1" max="100" step="1" value="20" required>
        <button id="submit" type="submit">开始仿真</button>
      </form>
      <p class="note">模型固定为 Industrial、无阴影衰落、静止节点和 20 ms 发包间隔。收包判定采用确定性的灵敏度门限。</p>
    </section>
    <section class="card" aria-live="polite">
      <h2>任务进度</h2>
      <div class="status"><span id="status" class="badge">尚未提交</span><span id="task-id" class="muted"></span></div>
      <progress id="progress" max="100" value="0"></progress>
      <p id="message" class="muted">提交参数后，任务将在后台执行。</p>
      <p id="error" class="error" hidden></p>
      <div id="report" class="report" hidden>
        <h2>仿真结果</h2>
        <p id="summary"></p>
        <svg id="chart" class="chart" viewBox="0 0 700 270" role="img" aria-label="距离与接收功率曲线"></svg>
        <div class="scroll"><table><thead><tr><th>距离 m</th><th>损耗 dB</th><th>接收功率 dBm</th><th>接收</th><th>丢弃</th></tr></thead><tbody id="results"></tbody></table></div>
        <h2 style="margin-top:24px">验证与解释</h2><p id="explanation"></p><ul id="limits"></ul>
      </div>
      <h2 style="margin-top:24px">执行事件</h2><div id="events" class="events">暂无事件</div>
    </section>
  </div>
</main>
<script>
  const $=id=>document.getElementById(id);
  let timer=null,latestSequence=0,eventLines=[];
  function svg(name,attrs){const node=document.createElementNS('http://www.w3.org/2000/svg',name);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,String(value));return node}
  function plot(points,sensitivity){
    const chart=$('chart');chart.replaceChildren();
    const x0=58,x1=675,y0=20,y1=225;
    const xs=points.map(p=>p.distance_m),ys=points.map(p=>p.received_power_dbm).concat([sensitivity]);
    const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.floor((Math.min(...ys)-5)/10)*10,ymax=Math.ceil((Math.max(...ys)+5)/10)*10;
    const x=value=>x0+(value-xmin)/(xmax-xmin)*(x1-x0),y=value=>y1-(value-ymin)/(ymax-ymin)*(y1-y0);
    chart.append(svg('line',{x1:x0,y1:y0,x2:x0,y2:y1,stroke:'#788ba0'}),svg('line',{x1:x0,y1:y1,x2:x1,y2:y1,stroke:'#788ba0'}));
    chart.append(svg('line',{x1:x0,y1:y(sensitivity),x2:x1,y2:y(sensitivity),stroke:'#b33b45','stroke-dasharray':'6 5','stroke-width':2}));
    chart.append(svg('polyline',{points:points.map(p=>`${x(p.distance_m)},${y(p.received_power_dbm)}`).join(' '),fill:'none',stroke:'#0879be','stroke-width':3}));
    for(const point of points)chart.append(svg('circle',{cx:x(point.distance_m),cy:y(point.received_power_dbm),r:5,fill:point.above_sensitivity?'#0879be':'#b33b45'}));
    for(const [label,px,py] of [[`${xmin} m`,x0,y1+21],[`${xmax} m`,x1-35,y1+21],[`${ymax} dBm`,5,y0+5],[`${ymin} dBm`,5,y1],[`灵敏度 ${sensitivity} dBm`,x1-150,y(sensitivity)-8]]){
      const text=svg('text',{x:px,y:py,fill:'#52647b','font-size':12});text.textContent=label;chart.append(text);
    }
  }
  function showResult(task){
    const result=task.result;$('report').hidden=false;
    $('summary').textContent=`验证通过。已测距离中最远可接收点：${result.sampled_reach_m===null?'无':result.sampled_reach_m+' m'}。`;
    plot(result.points,result.parameters.receiver_sensitivity_dbm);
    $('results').replaceChildren();for(const p of result.points){const row=document.createElement('tr');for(const value of [p.distance_m,p.path_loss_db.toFixed(2),p.received_power_dbm.toFixed(2),p.deliveries,p.drops]){const cell=document.createElement('td');cell.textContent=String(value);row.append(cell)}$('results').append(row)}
    $('explanation').textContent=result.explanation;$('limits').replaceChildren();for(const item of result.limitations){const li=document.createElement('li');li.textContent=item;$('limits').append(li)}
  }
  async function poll(id){
    try{
      const response=await fetch(`/api/v1/simulation-tasks/${id}`);if(!response.ok)throw Error(`读取任务失败：HTTP ${response.status}`);
      const task=await response.json();$('status').textContent=task.status;$('progress').value=task.progress;
      $('message').textContent=task.status==='running'?`已完成 ${task.progress}%`:`任务状态：${task.status}`;
      const eventResponse=await fetch(`/api/v1/simulation-tasks/${id}/events?after_sequence=${latestSequence}&limit=200`);
      if(eventResponse.ok){let data=await eventResponse.json();while(true){latestSequence=data.next_sequence;for(const event of data.events){const p=event.payload;eventLines.push(`${event.sequence} ${event.kind} ${p.tool||p.event_type||p.distance_m||''}`)}if(data.events.length<200)break;const next=await fetch(`/api/v1/simulation-tasks/${id}/events?after_sequence=${latestSequence}&limit=200`);if(!next.ok)break;data=await next.json()}eventLines=eventLines.slice(-80);$('events').replaceChildren();for(const line of eventLines){const div=document.createElement('div');div.textContent=line;$('events').append(div)}}
      if(task.status==='succeeded'){$('submit').disabled=false;showResult(task)}
      else if(task.status==='failed'){$('submit').disabled=false;$('error').hidden=false;$('error').textContent=`${task.error.code}: ${task.error.message}`}
      else timer=setTimeout(()=>poll(id),1000);
    }catch(error){$('submit').disabled=false;$('error').hidden=false;$('error').textContent=error.message}
  }
  $('task-form').addEventListener('submit',async event=>{
    event.preventDefault();clearTimeout(timer);$('submit').disabled=true;$('error').hidden=true;$('report').hidden=true;$('progress').value=0;latestSequence=0;eventLines=[];
    const distances=$('distances').value.split(',').map(part=>Number(part.trim()));
    const body={type:'ble_power_distance_v1',parameters:{tx_power_dbm:Number($('tx-power').value),receiver_sensitivity_dbm:Number($('sensitivity').value),distances_m:distances,packets_per_distance:Number($('packets').value)}};
    try{
      const response=await fetch('/api/v1/simulation-tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data=await response.json();if(!response.ok)throw Error(JSON.stringify(data.detail));
      $('task-id').textContent=`任务 ${data.id}`;history.replaceState(null,'',`?task_id=${encodeURIComponent(data.id)}`);await poll(data.id);
    }catch(error){$('submit').disabled=false;$('error').hidden=false;$('error').textContent=error.message}
  });
  const resumedTask=new URLSearchParams(location.search).get('task_id');
  if(resumedTask){$('task-id').textContent=`任务 ${resumedTask}`;$('submit').disabled=true;poll(encodeURIComponent(resumedTask))}
</script>
</body>
</html>
